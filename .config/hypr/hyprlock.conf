general {
    hide_cursor = true
}

background {
    monitor =
    # path = ~/wallpapers/kuro.jpg

    blur_passes = 0
    color = rgba(0, 0, 0, 1.0)
}

# Clock
label {
    monitor =
    text = $TIME

    font_family = JetBrains Mono
    font_size = 150 
    font_weight = 500

    color = rgba(255, 255, 255, 1.0)

    position = 0, 100
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %Y/%m/%d"

    font_family = JetBrains Mono
    font_size = 20 

    color = rgba(255, 255, 255, 0.50)

    position = 0, -30 

    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 240, 42

    position = 0, -100
    halign = center
    valign = center

    outline_thickness = 1

    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(0, 0, 0, 0.15)
    font_color = rgba(255, 255, 255, 0.85)

    dots_size = 0.20
    dots_spacing = 0.30

    fade_on_empty = true
    placeholder_text = "起きろ"
    fail_text = "もう一度"
}
