# Password
input-field {
    monitor =
    size = 170, 40 

    position = 0, -10 
    halign = center 
    valign = top 

    outline_thickness = 4 

  outer_color = rgba(180, 190, 254, 0.18) # Lavender
  inner_color = rgba(17, 17, 27, 0.15)    # Crust
  font_color = rgba(205, 214, 244, 0.85)  # Text

    dots_size = 0.20
    dots_spacing = 0.30

    fade_on_empty = true
    placeholder_text = it is your password! 
    fail_text = be careful!
}
