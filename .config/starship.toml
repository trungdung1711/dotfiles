# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'


palette = "catppuccin_mocha"

# Inserts a blank line between shell prompts
add_newline = true

format = """
$directory$git_branch$git_status $fill$conda
$character"""

[directory]
truncation_length = 3
truncate_to_repo = false
style = "bold lavender"

[character]
success_symbol = "[(green)❯](peach)"
error_symbol = "[(red)❯](peach)"
vimcmd_symbol = "[❮](subtext1)"

[git_branch]
format = " [$branch]($style)"
style = "bold mauve"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "bold maroon"
conflicted = "="
modified = "!"
staged = "+"
untracked = "?"
deleted = "-"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[fill]
symbol = " "
disabled = false

[conda]
symbol = ' '
format = "[$symbol$environment](green) "
truncation_length = 1
ignore_base = false
disabled = false


[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
